services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Healthcare HMS}
        NEXT_PUBLIC_ENV: ${NEXT_PUBLIC_ENV:-development}
    container_name: hms-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Healthcare HMS}
      NEXT_PUBLIC_ENV: ${NEXT_PUBLIC_ENV:-development}
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hms-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hms-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:mysql://mysql:3306/hms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: ${DATABASE_USERNAME:-hms_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-hms_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-access-token-secret-key-min-32-chars!!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-dev-refresh-token-secret-key-min-32-chars!}
      JWT_ALLOW_INSECURE_SECRETS: ${JWT_ALLOW_INSECURE_SECRETS:-true}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      JWT_ISSUER: ${JWT_ISSUER:-healthcare-hms}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-noreply@healthcare-hms.local}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      TENANT_SUBDOMAIN_RESOLUTION_ENABLED: ${TENANT_SUBDOMAIN_RESOLUTION_ENABLED:-false}
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-true}
      REMINDERS_SCHEDULER_ENABLED: ${REMINDERS_SCHEDULER_ENABLED:-false}
      REMINDERS_DISPATCH_CRON: ${REMINDERS_DISPATCH_CRON:-0 */5 * * * *}
      REMINDERS_BATCH_SIZE: ${REMINDERS_BATCH_SIZE:-50}
      REMINDERS_MAX_ATTEMPTS: ${REMINDERS_MAX_ATTEMPTS:-3}
      REMINDERS_LEAD_TIMES: ${REMINDERS_LEAD_TIMES:-24h,1h}
      REMINDERS_CHANNELS: ${REMINDERS_CHANNELS:-EMAIL}
      HMS_STORAGE_TYPE: ${HMS_STORAGE_TYPE:-local}
      HMS_STORAGE_LOCAL_PATH: ${HMS_STORAGE_LOCAL_PATH:-/data/object-storage}
      HMS_STORAGE_S3_ENDPOINT: ${HMS_STORAGE_S3_ENDPOINT:-http://minio:9000}
      HMS_STORAGE_S3_REGION: ${HMS_STORAGE_S3_REGION:-us-east-1}
      HMS_STORAGE_S3_BUCKET: ${HMS_STORAGE_S3_BUCKET:-hms-clinical}
      HMS_STORAGE_S3_ACCESS_KEY: ${HMS_STORAGE_S3_ACCESS_KEY:-minioadmin}
      HMS_STORAGE_S3_SECRET_KEY: ${HMS_STORAGE_S3_SECRET_KEY:-minioadmin}
      HMS_STORAGE_S3_PATH_STYLE: ${HMS_STORAGE_S3_PATH_STYLE:-true}
      MULTIPART_MAX_FILE_SIZE: ${MULTIPART_MAX_FILE_SIZE:-25MB}
      MULTIPART_MAX_REQUEST_SIZE: ${MULTIPART_MAX_REQUEST_SIZE:-30MB}
    volumes:
      - object-storage-data:/data/object-storage
    ports:
      - '8080:8080'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/actuator/health/liveness']
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - hms-network

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: hms-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hms-network

  mysql:
    image: mysql:8.4
    container_name: hms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: hms_db
      MYSQL_USER: ${DATABASE_USERNAME:-hms_user}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-hms_password}
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hms-network

  redis:
    image: redis:7.4-alpine
    container_name: hms-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - hms-network

  nginx:
    image: nginx:1.27-alpine
    container_name: hms-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - '80:80'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - hms-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: hms-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - '9090:9090'
    volumes:
      - ./docker/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - hms-network

  grafana:
    image: grafana/grafana:11.2.2
    container_name: hms-grafana
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - hms-network

volumes:
  mysql-data:
  redis-data:
  grafana-data:
  object-storage-data:
  minio-data:

networks:
  hms-network:
    driver: bridge

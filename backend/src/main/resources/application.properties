spring.application.name=hms-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/hms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# MySQL stores UUIDs as CHAR(36); Hibernate 6 defaults to BINARY binding otherwise.
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
# Redis is for future cache/session use only — do not treat JPA repositories as Redis repos.
spring.data.redis.repositories.enabled=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
# Redis is provisioned for future session/rate-limit use; disable health until code depends on it.
management.health.redis.enabled=false
management.health.mail.enabled=false

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# JWT (access: 15m, refresh: 7d per SECURITY.md). Override secrets via environment variables.
# Set JWT_ALLOW_INSECURE_SECRETS=false in staging/production so placeholder secrets fail startup.
hms.security.jwt.access-token-secret=${JWT_SECRET:change-me-access-token-secret-key-min-32-chars!!}
hms.security.jwt.refresh-token-secret=${JWT_REFRESH_SECRET:change-me-refresh-token-secret-key-min-32-chars!}
hms.security.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:15m}
hms.security.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:7d}
hms.security.jwt.issuer=${JWT_ISSUER:healthcare-hms}
hms.security.jwt.allow-insecure-secrets=${JWT_ALLOW_INSECURE_SECRETS:true}

# Password recovery (token TTL + frontend reset-link base URL)
hms.security.password-reset.token-expiration=${PASSWORD_RESET_EXPIRATION:1h}
hms.security.password-reset.frontend-base-url=${FRONTEND_URL:http://localhost:3000}

# Email verification (token TTL + frontend verify-link base URL)
hms.security.email-verification.token-expiration=${EMAIL_VERIFICATION_EXPIRATION:24h}
hms.security.email-verification.frontend-base-url=${FRONTEND_URL:http://localhost:3000}

hms.security.user-invitation.token-expiration=${USER_INVITATION_EXPIRATION:72h}
hms.security.user-invitation.frontend-base-url=${FRONTEND_URL:http://localhost:3000}

# Email delivery — disabled by default (logs reset/verification links). Enable with MAIL_ENABLED=true + SMTP_*.
hms.mail.enabled=${MAIL_ENABLED:false}
hms.mail.from=${MAIL_FROM:noreply@healthcare-hms.local}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Appointment reminders (Phase 6.8) — schedule rows on book; SMS/push use logging stubs until providers are wired.
hms.reminders.enabled=${REMINDERS_ENABLED:true}
hms.reminders.scheduler-enabled=${REMINDERS_SCHEDULER_ENABLED:false}
hms.reminders.dispatch-cron=${REMINDERS_DISPATCH_CRON:0 */5 * * * *}
hms.reminders.batch-size=${REMINDERS_BATCH_SIZE:50}
hms.reminders.max-attempts=${REMINDERS_MAX_ATTEMPTS:3}
hms.reminders.lead-times=${REMINDERS_LEAD_TIMES:24h,1h}
hms.reminders.channels=${REMINDERS_CHANNELS:EMAIL}

# CORS — trusted frontend origins only (comma-separated list supported)
hms.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost}
hms.security.cors.allow-credentials=true
hms.security.cors.max-age-seconds=3600

# Tenant resolution — header (X-Tenant-ID) is primary; subdomain mapping reserved for later.
hms.tenant.resolution.subdomain-enabled=${TENANT_SUBDOMAIN_RESOLUTION_ENABLED:false}

# Object storage — clinical note attachments (Phase 7.6). type=local|s3 (S3 also covers MinIO).
hms.storage.type=${HMS_STORAGE_TYPE:local}
hms.storage.local.base-path=${HMS_STORAGE_LOCAL_PATH:./data/object-storage}
hms.storage.s3.endpoint=${HMS_STORAGE_S3_ENDPOINT:}
hms.storage.s3.region=${HMS_STORAGE_S3_REGION:us-east-1}
hms.storage.s3.bucket=${HMS_STORAGE_S3_BUCKET:hms-clinical}
hms.storage.s3.access-key=${HMS_STORAGE_S3_ACCESS_KEY:}
hms.storage.s3.secret-key=${HMS_STORAGE_S3_SECRET_KEY:}
hms.storage.s3.path-style-access=${HMS_STORAGE_S3_PATH_STYLE:true}

# Multipart uploads (clinical attachments: images ≤10MB, PDFs ≤25MB)
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:30MB}
